<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pedometer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🚶 Simple Pedometer</h1>
        <p class="subtitle">Track your daily activity</p>

        <div class="steps-card">
            <p class="label">Today's Steps</p>
            <h2 id="stepCount">0</h2>
            <p>steps</p>
        </div>

        <div class="progress-section">

            <div class="progress-info">
                <span>Daily Goal</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <p>Goal: <span id="goalText">10,000</span> steps</p>

        </div>

        <div class="input-section">

            <label for="stepsInput">
                Enter today's steps
            </label>

            <input
                type="number"
                id="stepsInput"
                placeholder="Example: 6500"
                min="0"
            >

            <button onclick="calculateSteps()">
                Calculate
            </button>

        </div>

        <div class="stats">

            <div class="stat-card">
                <span>📍</span>
                <h3 id="distance">0 km</h3>
                <p>Distance</p>
            </div>

            <div class="stat-card">
                <span>🔥</span>
                <h3 id="calories">0 kcal</h3>
                <p>Calories</p>
            </div>

        </div>

        <div class="message" id="message">
            Enter your steps to see your progress.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
